name: Portal de Tarefas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificacao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: PortalTarefas.Frontend/package-lock.json
      - name: Usar Chrome do runner
        run: |
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
      - run: ./tests/pipeline.sh
        env:
          PORTAL_EVIDENCIAS: ${{ runner.temp }}/evidencias
      - uses: actions/upload-artifact@v4
        with:
          name: portal-${{ github.sha }}
          path: |
            artifacts/portal-*.tar.gz
            ${{ runner.temp }}/evidencias/
  imagem:
    needs: verificacao
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/imagem.sh
        env:
          REVISAO: ${{ github.sha }}
